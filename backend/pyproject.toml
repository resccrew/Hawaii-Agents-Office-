[project]
name = "studio-ops-backend"
version = "0.1.0"
description = "Backend for the Studio Ops game-dev studio visualizer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "websockets>=13.0",
    # Pinned below 2.0: mcp 2.x renamed FastMCP to MCPServer and moved it
    # (mcp.server.fastmcp -> mcp.server.mcpserver), which app/mcp/
    # studio_ops_mcp.py isn't written against. Found while adding the
    # memory MCP tools — `from mcp.server.fastmcp import FastMCP` fails
    # outright with mcp 2.2.0, which `mcp>=1.28.0` alone happily resolves
    # to on a fresh `uv pip install`. This is pre-existing breakage, not
    # introduced by this change: every studio_* MCP tool (list_agents,
    # send_message, the task board, ...) is affected identically, not just
    # the new memory ones — worth a real migration to the 2.x API at some
    # point, not just re-pinning, but that's out of scope here.
    "mcp>=1.28.0,<2",
    # Runtime HTTP client for the studio-ops MCP server (studio_ops_mcp.py)
    # and the OpenAI/Gemini/Ollama conversational providers — previously
    # only listed under dev (worked by accident: dev deps happened to be
    # installed in this venv), moved here since it's genuinely load-bearing
    # at runtime now, not just in tests.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # build_sidecar.py shells out to `python -m PyInstaller` to produce the
    # Tauri sidecar binary — wasn't declared anywhere, so a fresh checkout's
    # `uv pip install -e ".[dev]"` left the desktop build broken with a bare
    # ModuleNotFoundError the first time anyone tried `make desktop`.
    "pyinstaller>=6.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
