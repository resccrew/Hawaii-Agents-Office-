name: Release (macOS)

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # No signing identity is configured (ad-hoc signed, same as a local
      # `make desktop` — see README's Gatekeeper note in the Install
      # section). The .dmg step drives Finder over AppleScript to lay out
      # icons; that's occasionally flaky even on a real GUI session
      # (`hdiutil`/AppleEvent timeouts under load), so retry a couple of
      # times before failing the release outright.
      - name: Build desktop app (.app + .dmg)
        run: |
          for attempt in 1 2 3; do
            if bash scripts/build-desktop.sh; then
              exit 0
            fi
            echo "::warning::build-desktop.sh failed (attempt $attempt/3), retrying..."
            sleep 5
          done
          exit 1

      - name: Locate the .dmg
        id: dmg
        run: |
          dmg_path="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "::error::no .dmg found under src-tauri/target/release/bundle/dmg"
            exit 1
          fi
          echo "path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.path }}
          body: |
            Unsigned macOS build (ad-hoc signed, no Developer ID). Gatekeeper
            will warn on first launch — right-click the app in Applications
            and choose **Open** once to run it. See the README's Install
            section for details.
